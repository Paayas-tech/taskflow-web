appId: com.paayas.taskflow
productName: TaskFlow

directories:
  output: ../../release

files:
  - electron/**/*
  - "!electron/**/*.test.cjs"
  - package.json
  - "!**/*.map"
  - "!**/.env"
  - "!**/.env.*"
  - "!**/*backup*"
  - "!node_modules/**/*"

extraResources:
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
      - "!**/*.map"

asar: true
npmRebuild: false

protocols:
  - name: TaskFlow
    schemes:
      - taskflow

win:
  target:
    - nsis

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip

linux:
  category: Office
  target:
    - AppImage
