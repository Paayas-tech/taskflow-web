name: Build Electron installers

on:
  push:
    branches:
      - main
      - feature/electron-alpha
  workflow_dispatch:

# The workflow only needs permission to read the repository contents.
permissions:
  contents: read

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            artifact_name: taskflow-linux
            artifact_paths: |
              release/*.AppImage
          - platform: macOS
            os: macos-latest
            artifact_name: taskflow-macos
            artifact_paths: |
              release/*.dmg
              release/*.zip

    runs-on: ${{ matrix.os }}

    # Internal alpha builds are intentionally unsigned for now.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      # Download the exact revision that triggered this workflow.
      - name: Check out repository
        uses: actions/checkout@v4

      # Node.js 24 is the current LTS release used for reproducible npm installs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install exactly the dependency versions recorded in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Build the Vite renderer and package it for the native runner platform.
      - name: Build Electron installer
        run: npm run electron:dist

      # Keep the native installers available from the completed workflow run.
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
